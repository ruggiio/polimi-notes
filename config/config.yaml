# ============================================================
#  PoliMi Lecture Notes Pipeline — Configuration
# ============================================================

auth:
  username: ""          # Your PoliMi Person Code (e.g. 10XXXXXX)
  password: ""          # Or use env vars: POLIMI_USER / POLIMI_PASS

download:
  output_dir: "output/videos"
  cookies_file: "config/webex_cookies.json"
  quality: "best"

transcription:
  model: "medium"        # faster-whisper model
  language: null         # null = auto-detect
  device: "cuda"
  output_dir: "output/transcripts"

ocr:
  enabled: true
  frame_interval_sec: 10
  scene_change_threshold: 0.35
  output_dir: "output/frames"
  languages: ["it", "en"]
  gpu: true
  math_only_filter: false   # true  = keep only formulas/symbols from slides (cheaper)
                             # false = keep ALL slide text not in transcript (recommended)
  vision_for_handwriting: false  # true = use Claude Vision for handwritten/blackboard frames
                                  # requires ANTHROPIC_API_KEY env var

# Course mode: every lecture's .tex is archived automatically in
# output/course/<course-slug>/. To work per-course without per-lecture PDFs,
# set latex.compile_pdf: false below; when the course is over, build the
# single cohesive PDF with:  python -m src.course_builder "Course Name"
# (add --no-polish to skip the Claude cohesion pass between chapters)
notes:
  backend: "claude-code"    # claude-code = `claude -p` (abbonamento Claude Code, nessuna API key)
                            # claude = Anthropic API (ANTHROPIC_API_KEY) / ollama / openai
  use_tools: false          # true = enable Claude tool use for transcript/OCR/figure lookup
  auto_fix_latex: true      # true = auto-retry LaTeX compilation with LLM error fixing

  claude:
    model: "claude-sonnet-4-6"
    api_key: ""          # Or set env var ANTHROPIC_API_KEY
    max_tokens: 64000

  claude-code:
    model: "sonnet"      # alias CLI: sonnet / opus / fable, o un model id completo
    timeout: 1800        # secondi per chiamata
    # effort: medium     # low/medium/high: controlla il thinking (default del CLI se omesso)

  ollama:
    model: "mistral"
    host: "http://localhost:11434"

  openai:
    model: "gpt-4o"
    api_key: ""

  latex:
    output_dir: "output/latex"      # .tex always overwritten here
    pdf_output_dir: "output/notes"  # PDFs saved here with date+course name
    compile_pdf: true
    template: "default"

figures:
  enabled: true           # Set to true to enable Claude Vision figure extraction
  model: "claude-sonnet-4-6"
  api_key: ""              # Uses ANTHROPIC_API_KEY env var if empty
  max_candidates: 30       # Max frames to analyze with Vision API (cost control)
  complexity_threshold: 0.05  # Min visual complexity score to be a candidate

gemini:
  model: "gemini-2.0-flash-lite"  # Used for PDF figure extraction in ingest-pdf
  api_key: ""                      # Or set GEMINI_API_KEY env var

rag:
  enabled: true             # true = enable RAG for cross-lecture context
  db_path: "output/rag"    # ChromaDB persistent storage path
  n_results: 5             # Number of passages to retrieve
  chunk_size: 500          # Words per chunk when indexing
  chunk_overlap: 50        # Word overlap between chunks

# ── Job notturno (tools/nightly.py, timer systemd) ────────────────────────────
auto:
  courses:                       # corsi da seguire nell'Archivio registrazioni
    - name: "BIOINSPIRED ROBOTICS"   # nome usato per scheda corso e titolo delle note
      match: "BIOINSPIRED"           # filtro campo "Corso" dell'archivio (nome o codice)
      slides_links:                  # moduli url di WeBeep (o link OneDrive) con le slide: scaricati ogni notte
        - "https://webeep.polimi.it/mod/url/view.php?id=488848"
      # model: opus                  # override del modello per questo corso (default: notes.claude-code.model)
      # aa: 2025                     # anno di inizio A.A.; omesso = A.A. corrente
                                     # (decommenta per recuperare il 25/26: 6 lezioni ≈ 1.5 GB, ~30 min GPU, 6 chiamate a Claude)
  kind: null                     # forma didattica: null = tutte, oppure LE lezione / LA lab / ES esercitazione / OT
  state_file: "output/auto/state.json"
  log_file: "output/auto/nightly.log"
  keep_videos: true              # false = cancella l'mp4 dopo trascrizione riuscita
  notify: true                   # notify-send per login richiesto / errori
  max_failures: 3                # dopo N fallimenti di uno stadio la lezione viene saltata
  slides_dir: "~/Scrivania/POLI"          # cartella di WeBeep Sync (o qualsiasi <dir>/<NOME CORSO>/**/*.pdf)
  slides: true                   # cerca le slide della lezione: glossario per Whisper, testo + figure per gli appunti
  slides_max_mb: 2000            # non scaricare dai link file più grandi di così
  slides_max_figures: 8          # figure candidate offerte al modello (le più pertinenti alla trascrizione)
  slides_triage: true            # provino + Haiku (vision) per scartare sfondi/ritratti/screenshot e dare didascalie (~$0.05/deck)
  slides_triage_model: "haiku"
